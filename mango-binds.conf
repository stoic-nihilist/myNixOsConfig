# Custom keybinds, included from your main config via: source=~/.config/mango/mango-binds.conf
# Managed by Home Manager - do not edit directly, changes will be overwritten
# on the next `home-manager switch`.
#
# Stock mangowm binds live under Alt (terminal/launcher/close/focus) and
# Super+M/F (quit/fullscreen) only - unlike niri and Sway, there's no
# stock h/j/k/l vim-nav conflict here, so SUPER+H is free to use directly.

# Autostart
exec-once=noctalia-shell

# Apps
bind=SUPER,H,spawn,helium
bind=SUPER,S,spawn,spotify
bind=SUPER,E,spawn,thunar
bind=SUPER,T,spawn,kitty

# Close focused window
bind=SUPER,Q,killclient

# Noctalia launcher ("Search"/"Center")
# NOTE: this exact IPC call did not work when tried under niri earlier -
# treat as unverified until tested here. Run `which noctalia-shell` first
# to confirm the binary actually resolves before relying on this bind.
bind=SUPER,SPACE,spawn,noctalia-shell ipc call launcher toggle
