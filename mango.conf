# Custom keybinds, included from your main config via: source=~/.config/mango/mango-binds.conf
# Managed by Home Manager - do not edit directly, changes will be overwritten
# on the next `home-manager switch`.
#
# Stock mangowm binds live under Alt (terminal/launcher/close/focus) and
# Super+M/F (quit/fullscreen) only - unlike niri and Sway, there's no
# stock h/j/k/l vim-nav conflict here, so SUPER+H is free to use directly.

# Autostart
#exec-once=waybar
#exec-once=mangobar
#exec-once=sh -c 'systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP; systemctl --user start mangobar'
#exec-once=sh -c 'systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP; dms run'
#exec-once=gpuishell

# Switch tag
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Move window to tag
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Adjacent tag
bind=SUPER,Left,viewtoleft_have_client
bind=SUPER,Right,viewtoright_have_client


#Exit/Logout
bind=SUPER+Shift,M,spawn,mmsg dispatch quit


# Input
  trackpad_natural_scrolling=1
  mouse_natural_scrolling=1
  tap_to_click=1
  
'';

# Apps
bind=SUPER,H,spawn,helium
bind=SUPER,S,spawn,spotify
bind=SUPER,E,spawn,nautilus
bind=SUPER,T,spawn,ghostty
bind=SUPER,M,spawn,mailspring

# Close focused window
bind=SUPER,Q,killclient

#exit mango
bind=SUPER+SHIFT,m,spawn, loginctl terminate-session


# Noctalia launcher ("Search"/"Center")
# NOTE: this exact IPC call did not work when tried under niri earlier -
# treat as unverified until tested here. Run `which noctalia-shell` first
# to confirm the binary actually resolves before relying on this bind.
bind=SUPER,SPACE,spawn,noctalia shell ipc call launcher toggle
